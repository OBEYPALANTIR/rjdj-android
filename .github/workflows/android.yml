name: Android CI

on:
  push:
    branches:
    - main
    paths-ignore:
    - '**/README.md'
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - run: |
        git submodule sync --recursive
        git submodule update --init --recursive
    - name: Install Android 17 build tools
      run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
    - run: ./gradlew :ScenePlayer:checkSceneFiles :ScenePlayer:assembleDebug :ScenePlayer:assembleDebugAndroidTest :ScenePlayer:lintDebug --max-workers=2
    - uses: actions/upload-artifact@v5
      with:
        name: rjdj-android17-debug
        path: |
          ScenePlayer/build/outputs/apk/debug/ScenePlayer-debug.apk
          ScenePlayer/build/outputs/apk/androidTest/debug/ScenePlayer-debug-androidTest.apk
