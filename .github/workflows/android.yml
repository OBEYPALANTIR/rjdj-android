name: Android CI

on:
  push:
    branches:
    - main
    paths-ignore:
    - '**/README.md'
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - run: |
        git submodule sync --recursive
        git submodule update --init --recursive
    - name: Set up Android 17 SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865'
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version 4.1.2 --locked
    - name: Check Rust core
      run: cargo test --manifest-path rust/rjdj-core/Cargo.toml
    - run: ./gradlew :ScenePlayer:assembleDebug :ScenePlayer:assembleDebugAndroidTest :ScenePlayer:lintDebug --max-workers=2
    - name: Check 16 KB alignment
      shell: bash
      run: |
        objdump="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
        for library in ScenePlayer/build/rust/debug/arm64-v8a/librjdjcore.so ScenePlayer/build/externals/debug/arm64-v8a/librj_*.so; do
          "$objdump" -p "$library" | tee /dev/stderr | awk '
            $1 == "LOAD" { loads++; if ($NF != "2**14") bad = 1 }
            END { exit (!loads || bad) }'
        done
        "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 ScenePlayer/build/outputs/apk/debug/ScenePlayer-debug.apk
    - uses: actions/upload-artifact@v5
      with:
        name: rjdj-android17-debug
        path: |
          ScenePlayer/build/outputs/apk/debug/ScenePlayer-debug.apk
          ScenePlayer/build/outputs/apk/androidTest/debug/ScenePlayer-debug-androidTest.apk
