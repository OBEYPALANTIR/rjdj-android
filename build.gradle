buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    minSdk = 28
    compileSdk = 37
    androidxLegacySupportVersion = '1.0.0'
    ndkVersion = libs.versions.ndk.get()
}
