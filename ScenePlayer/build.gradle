apply plugin: 'com.android.application'

dependencies {
    implementation 'io.github.libpd.android:pd-core:' + rootProject.pdCoreVersion
}

android {
    compileSdk = rootProject.compileSdk
    buildToolsVersion '37.0.0'
    ndkVersion = rootProject.ndkVersion
    namespace = 'org.puredata.android.scenes'

    defaultConfig {
        applicationId 'org.rjdj.revival'
        minSdk rootProject.minSdk
        targetSdkVersion 37
        versionCode 12
        versionName '0.10.0'
        testInstrumentationRunner 'org.puredata.android.scenes.SceneEngineInstrumentation'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }

        // Move the build types to build-types/<type>
        // For instance, build-types/debug/java, build-types/debug/AndroidManifest.xml, ...
        // This moves them out of them default location under src/<type>/... which would
        // conflict with src/ being used by the main source set.
        // Adding new build types or product flavors should be accompanied
        // by a similar customization.
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
        test.java.srcDirs = ['test']
        androidTest.setRoot('instrumentation')
    }

    packagingOptions {
        jniLibs {
            // since externals are loaded at native code level, they need to be copied to the actual
            // filesystem, instead of staying in the apk; so we must set useLegacyPackaging:
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        // Extract native libs from prefab, to be able to access the headers and to link to the libs
        prefab = true
        viewBinding = true
    }

    defaultConfig {
        externalNativeBuild {
            ndkBuild {
                // NDK make's output synchronization crashes on macOS 27.
                arguments '-j' + gradle.startParameter.maxWorkerCount, '--output-sync=none'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
}

tasks.register('checkSceneFiles', Exec) {
    commandLine 'sh', 'test/check-scenes.sh'
}

tasks.named('check').configure { dependsOn 'checkSceneFiles' }

